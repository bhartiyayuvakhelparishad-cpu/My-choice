<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride Filter Bot</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>🚖 Auto Ride Filter Pro</h1>
      <p>Ola / Uber / Rapido / Porter Assistant</p>
    </header>

    <!-- स्टेटस ब्लॉक -->
    <div class="card">
      <div id="statusBox" class="status-box inactive">फिल्टर बंद है (Inactive)</div>
      <button id="toggleBtn" class="btn" style="margin-top: 10px;">फिल्टर चालू करें</button>
      <div id="cooldownMsg" style="margin-top: 8px; color: #f59e0b; font-weight: bold; text-align: center;"></div>
    </div>

    <!-- ऐप सेलेक्ट टॉगल (Ola, Uber, Rapido, Porter) -->
    <div class="card">
      <h2>📱 प्लेटफॉर्म चुनें (Enable Apps)</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px;">
        <label><input type="checkbox" id="appOla" checked> Ola</label>
        <label><input type="checkbox" id="appUber" checked> Uber</label>
        <label><input type="checkbox" id="appRapido" checked> Rapido</label>
        <label><input type="checkbox" id="appPorter" checked> Porter</label>
      </div>
    </div>

    <!-- नियम सेट करने का ब्लॉक (Hardcoded values removed so LocalStorage works) -->
    <div class="card">
      <h2>🎯 राइड सेटिंग्स (Rules)</h2>
      
      <div class="form-group">
        <label for="minFare">न्यूनतम किराया (Min Fare ₹):</label>
        <input type="number" id="minFare" placeholder="उदा. 125">
      </div>

      <div class="form-group">
        <label for="minDist">न्यूनतम दूरी (Min Distance KM):</label>
        <input type="number" id="minDist" placeholder="उदा. 5">
      </div>

      <div class="form-group">
        <label for="blockArea">ब्लॉक एरिया (Blocked Areas):</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="blockAreaInput" placeholder="एरिया का नाम (उदा. Jamia)">
          <button id="addAreaBtn" class="btn" style="width: 80px;">जोड़ें</button>
        </div>
      </div>

      <div id="areaList" style="margin-top: 10px;"></div>
    </div>

    <!-- राइड टेस्ट सिमुलेटर -->
    <div class="card">
      <h2>🧪 राइड टेस्ट करें (Testing)</h2>
      <div class="form-group">
        <label for="testApp">टेस्ट ऐप चुनें:</label>
        <select id="testApp" style="width:100%; padding:10px; border-radius:8px; background:#0f172a; color:#fff;">
          <option value="Ola">Ola</option>
          <option value="Uber">Uber</option>
          <option value="Rapido">Rapido</option>
          <option value="Porter">Porter</option>
        </select>
      </div>
      <div class="form-group">
        <label for="testFare">टेस्ट किराया (₹):</label>
        <input type="number" id="testFare" value="180">
      </div>
      <div class="form-group">
        <label for="testDist">टेस्ट दूरी (KM):</label>
        <input type="number" id="testDist" value="7">
      </div>
      <div class="form-group">
        <label for="testLoc">टेस्ट ड्रॉप एरिया:</label>
        <input type="text" id="testLoc" value="Connaught Place">
      </div>
      <button id="testRideBtn" class="btn btn-danger">राइड टेस्ट करें</button>
      <div id="testResult" style="margin-top: 10px; font-weight: bold; text-align: center;"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
